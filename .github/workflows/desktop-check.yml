name: Desktop checks

on:
  push:
    branches: [main, master]
    paths:
      - 'src-tauri/**'
      - 'scripts/build-audio-helper.sh'
      - '.github/workflows/desktop-check.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'scripts/build-audio-helper.sh'
      - '.github/workflows/desktop-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Check ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Native lease, input and coordinate tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -p remote-assist-core
      - name: macOS audio sidecar
        if: runner.os == 'macOS'
        run: bash scripts/build-audio-helper.sh
      - name: Windows sidecar placeholder
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType File -Force src-tauri/binaries/audio-capture-x86_64-pc-windows-msvc.exe
      - name: Check complete native shell and platform adapters
        run: cargo check --locked --all-targets --manifest-path src-tauri/Cargo.toml
      - name: Repository coach native lease contracts
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib coach_capture::tests
      - name: Mouse pass-through failure and recovery contracts
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib pointer_mode::tests
      - name: Inline selected-window lease contracts
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib inline_overlay::tests
