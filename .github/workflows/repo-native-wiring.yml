name: Register repository native bridge
on:
  pull_request:
    paths:
      - 'scripts/wire-repo-native.mjs'
      - 'src-tauri/src/repo_capture.rs'
permissions:
  contents: read
jobs:
  wire:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/repo-live-guidance-20260925'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/repo-live-guidance-20260925
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Apply guarded registration to existing native shell and explicit selector
        run: node scripts/wire-repo-native.mjs
      - name: Commit only allowlisted integration files, never force push
        run: |
          if git diff --quiet -- src-tauri/src/lib.rs components/repoLive/RepositoryWorkspace.tsx; then exit 0; fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src-tauri/src/lib.rs components/repoLive/RepositoryWorkspace.tsx
          git commit -m 'Register native repository capture and explicit display selector'
          git push origin HEAD:refs/heads/feat/repo-live-guidance-20260925
