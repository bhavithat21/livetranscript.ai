name: Repository coach QA
on:
  pull_request:
    paths:
      - 'lib/coach/**'
      - 'lib/copilot/**'
      - 'lib/interview/**'
      - 'lib/rehearsal/**'
      - 'components/rehearsal/**'
      - 'app/api/rehearsal/**'
      - 'rehearsals/**'
      - 'components/coach/**'
      - 'components/interview/**'
      - 'components/nav/**'
      - 'app/globals.css'
      - 'app/(app)/interview/**'
      - 'app/api/copilot/coach/**'
      - 'qa/coach/**'
      - 'scripts/test-repo-coach.mjs'
      - 'scripts/*rehearsal-env.mjs'
      - 'docs/rehearsal/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/repository-coach.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Evidence and asynchronous controller contracts (no model calls)
        run: |
          mkdir -p qa-results/coach
          set -o pipefail
          node --test scripts/test-repo-coach.mjs | tee qa-results/coach/contracts.txt
          node --test scripts/test-copy-rehearsal-env.mjs | tee qa-results/coach/env-helper.txt
          SIMULATOR_REPORT=qa-results/coach/simulator-suite.json pnpm run test:simulator | tee qa-results/coach/simulator.txt
      - name: Interactive starter baseline (not an agent solution)
        run: node --test rehearsals/maze-change/starter/test/*.check.mjs
      - name: Install pinned browser test runtime
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Real UI viewport and replay verification with fixture models
        run: |
          node qa/coach/server.mjs > qa-results/coach/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4180 >/dev/null && break; sleep 1; done
          python3 qa/coach/verify.py
          python3 qa/coach/focus.py
          python3 qa/coach/simulator.py
          python3 qa/coach/rehearsal.py
      - name: Record exact source snapshot (tracked files only)
        if: always()
        run: |
          mkdir -p qa-results
          git archive --format=tar.gz HEAD > qa-results/repo-coach-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-coach-qa-${{ github.run_id }}
          path: qa-results/
          retention-days: 14
