name: Repository live validation
on:
  pull_request:
    paths:
      - 'lib/repo/live/**'
      - 'components/repoLive/**'
      - 'app/**'
      - 'scripts/test-repo-browser.mjs'
      - 'scripts/repo-goldens.mjs'
      - '.github/workflows/repo-live-validation.yml'
  push:
    branches: [main]
    paths:
      - 'lib/repo/live/**'
      - 'components/repoLive/**'
      - 'app/**'
      - 'scripts/test-repo-browser.mjs'
      - 'scripts/repo-goldens.mjs'
      - '.github/workflows/repo-live-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repo-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Build the actual application without provider credentials
        run: pnpm run build
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/repo-browser" --no-audit --no-fund playwright@1.56.1
          node "$RUNNER_TEMP/repo-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Start application and check replay, privacy, and seven viewport widths
        env:
          REPO_BROWSER_DIR: ${{ runner.temp }}/repo-browser
        run: |
          mkdir -p artifacts/repo-browser
          pnpm start > artifacts/repo-browser/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/api/health >/dev/null && break; sleep 1; done
          node scripts/test-repo-browser.mjs
      - name: Save browser measurements, screenshots, and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-live-browser-${{ github.sha }}
          path: artifacts/repo-browser/
          retention-days: 14
  golden-repositories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [javascript, typescript, python, java, go, csharp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with: { python-version: '3.12' }
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with: { go-version: '1.23.12', cache: false }
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with: { dotnet-version: '8.0.x' }
      - name: Install compiler for TypeScript fixtures only
        if: matrix.language == 'typescript'
        run: npm install --prefix "$RUNNER_TEMP/repo-ts" --no-audit --no-fund typescript@5.9.3
      - name: Verify seeded failures and reference patches (no AI inference)
        env:
          REPO_TYPESCRIPT_ROOT: ${{ runner.temp }}/repo-ts
        run: node scripts/repo-goldens.mjs --language '${{ matrix.language }}'
      - name: Save fixture manifests and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-goldens-${{ matrix.language }}-${{ github.sha }}
          path: artifacts/repo-goldens/
          retention-days: 14
