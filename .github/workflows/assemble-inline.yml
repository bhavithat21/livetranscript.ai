name: Assemble verified Inline Coach source
on:
  push:
    branches: [build/inline-coach-inputs-20260926]
permissions:
  contents: write
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact reviewed delta
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,pathlib,subprocess
          def git(*args): return subprocess.check_output(['git',*args]).decode().strip()
          packed=base64.b64decode(''.join(pathlib.Path(f'.source-input/inline.{i}.b64').read_text().strip() for i in range(4)),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='34ac45f01f23a39472531cd073f734df4d2172b0039ea44cf55dcacd0d0accaa','Source checksum mismatch'
          data=json.loads(lzma.decompress(packed))
          base='6ddebb82e5463b6dda899ffa228f33437e3aa668'
          assert data['base']==base
          subprocess.run(['git','checkout','--detach',base],check=True)
          paths=[]
          for f in data['files']:
            p=f['path']; obj=pathlib.PurePosixPath(p)
            assert not obj.is_absolute() and '..' not in obj.parts and '.git' not in obj.parts and not p.startswith('.source-input/')
            before=subprocess.run(['git','rev-parse','HEAD:'+p],text=True,capture_output=True)
            actual=before.stdout.strip() if before.returncode==0 else None
            assert actual==f['before'],'Preimage mismatch: '+p
            paths.append(p)
          patch=data['patch'].encode()
          subprocess.run(['git','apply','--check','--binary','-'],input=patch,check=True)
          subprocess.run(['git','apply','--binary','-'],input=patch,check=True)
          for f in data['files']: assert git('hash-object',f['path'])==f['after'],'Output mismatch: '+f['path']
          subprocess.run(['git','add','--',*paths],check=True)
          full_tree=git('write-tree')
          assert full_tree==data['tree']=='4d68356445f1b334d78b6abc90a8b353445f275f','Tree mismatch'
          workflows=[p for p in paths if p.startswith('.github/workflows/')]
          subprocess.run(['git','reset','HEAD','--',*workflows],check=True)
          subprocess.run(['git','config','user.name','LiveTranscript source assembly'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','Add evidence-anchored Inline Coach and safe desktop input modes'],check=True)
          branch='feat/inline-coach-pointer-20260926'
          subprocess.run(['git','push','origin','HEAD:refs/heads/'+branch],check=True)
          report={'branch':branch,'commit':git('rev-parse','HEAD'),'tree':git('rev-parse','HEAD^{tree}'),'expectedCompleteTree':full_tree,'files':len(paths),'payloadSha256':hashlib.sha256(packed).hexdigest(),'workflows':workflows}
          pathlib.Path('/tmp/inline-source-report.json').write_text(json.dumps(report,indent=2)); print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-inline-source
          path: /tmp/inline-source-report.json
          retention-days: 7
