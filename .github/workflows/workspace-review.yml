name: Workspace review source
on:
  push:
    branches: [codex/complete-speakers-voice]
    paths: ['.github/workflows/workspace-review.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked public source only
        run: git archive --format=tar.gz --output=/tmp/review-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: review-source
          path: /tmp/review-source.tar.gz
          retention-days: 1
