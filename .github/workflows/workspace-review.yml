name: Workspace review source
on:
  push:
    branches: [codex/complete-speakers-voice]
    paths: ['.github/workflows/workspace-review.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Archive tracked source and pinned public dependencies
        run: |
          git archive --format=tar.gz --output=/tmp/review-source.tar.gz HEAD
          tar -czf /tmp/review-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: review-environment
          path: /tmp/review-*.tar.gz
          retention-days: 1
