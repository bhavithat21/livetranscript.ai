name: Desktop release

# Build signed macOS + Windows installers and the Tauri updater manifest whenever
# a version tag (e.g. v0.1.0) is pushed. The updater endpoint in tauri.conf.json
# points at this repo's latest release `latest.json`, so shipped apps auto-update.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write # create the release + upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple silicon + Intel (universal)
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend deps (for the Tauri CLI)
        run: pnpm install --frozen-lockfile

      # macOS: compile the ScreenCaptureKit audio sidecar (universal) into the
      # externalBin path before bundling. Signed with the app identity by
      # tauri-action so it inherits the app's single Screen-Recording grant.
      - name: Build macOS audio-capture sidecar
        if: matrix.platform == 'macos-latest'
        run: bash scripts/build-audio-helper.sh

      # Windows has no ScreenCaptureKit helper (capture is in-process cpal), but
      # externalBin still needs a file for the target triple. Drop a placeholder.
      - name: Placeholder sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: New-Item -ItemType File -Force src-tauri/binaries/audio-capture-x86_64-pc-windows-msvc.exe
        shell: pwsh

      - name: Build + publish desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (required for auto-update). Set these in repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- macOS code signing + notarization (OPTIONAL) ---
          # Gated on the cert secret being present. Beta has no Apple cert, so these
          # resolve to empty and tauri-action produces an UNSIGNED mac build. Passing
          # an empty APPLE_CERTIFICATE (as the old unconditional form did) makes
          # tauri-action attempt `security import` on nothing and the build fails —
          # hence the `!= '' && ... || ''` guard on every Apple var.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_TEAM_ID || '' }}
        with:
          projectPath: .
          # @tauri-apps/cli isn't a project dep; npx fetches it on-demand in CI so
          # the pnpm lockfile stays untouched. App deps still install via pnpm above.
          tauriScript: npx @tauri-apps/cli
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'LiveTranscript ${{ github.ref_name }}'
          releaseBody: 'Auto-generated release. The desktop app updates itself on launch.'
          releaseDraft: false
          prerelease: false
          # tauri-action generates latest.json (the updater manifest) and uploads it
          # to the release, matching the endpoint in tauri.conf.json.
          includeUpdaterJson: true
