name: Desktop release

# Build signed macOS + Windows installers and the Tauri updater manifest whenever
# a version tag (e.g. v0.1.0) is pushed. The updater endpoint in tauri.conf.json
# points at this repo's latest release `latest.json`, so shipped apps auto-update.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write # create the release + upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple silicon + Intel (universal)
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    # Surface the signing secrets as job ENV so step `if:` can test them — `secrets.*`
    # is NOT allowed in a step-level `if:` (it fails the whole workflow at parse time),
    # but `env.*` is. Empty when the secret is unset → signing steps skip → green.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE }}
      HAS_AZURE_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend deps (for the Tauri CLI)
        run: pnpm install --frozen-lockfile

      # macOS: compile the ScreenCaptureKit audio sidecar (universal) into the
      # externalBin path before bundling. Signed with the app identity by
      # tauri-action so it inherits the app's single Screen-Recording grant.
      - name: Build macOS audio-capture sidecar
        if: matrix.platform == 'macos-latest'
        run: bash scripts/build-audio-helper.sh

      # Windows has no ScreenCaptureKit helper (capture is in-process cpal), but
      # externalBin still needs a file for the target triple. Drop a placeholder.
      - name: Placeholder sidecar (Windows)
        if: matrix.platform == 'windows-latest'
        run: New-Item -ItemType File -Force src-tauri/binaries/audio-capture-x86_64-pc-windows-msvc.exe
        shell: pwsh

      # TURNKEY macOS SIGNING: export the Apple signing vars into the job env ONLY
      # when the cert secret is non-empty. This is the fix for "Actions can't omit an
      # env key inline" — an EMPTY APPLE_CERTIFICATE makes tauri-action run
      # `security import` on empty data and FAIL, so the vars must be truly ABSENT
      # when unsigned. Writing to $GITHUB_ENV conditionally achieves that: no secret
      # → nothing exported → clean unsigned build (green); secret present → signed +
      # notarized automatically. Add these repo secrets to turn signing on:
      #   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
      #   APPLE_SIGNING_IDENTITY ("Developer ID Application: NAME (TEAMID)"),
      #   APPLE_ID, APPLE_PASSWORD (app-specific pw), APPLE_TEAM_ID.
      - name: Enable macOS signing (only if cert secret present)
        if: matrix.platform == 'macos-latest' && env.HAS_APPLE_CERT != ''
        run: |
          {
            echo "APPLE_CERTIFICATE=${{ secrets.APPLE_CERTIFICATE }}"
            echo "APPLE_CERTIFICATE_PASSWORD=${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}"
          } >> "$GITHUB_ENV"
          echo "macOS signing + notarization ENABLED for this build."

      # TURNKEY Windows SIGNING (Azure Trusted Signing): export the Azure creds into
      # the job env ONLY when set. tauri.conf.json's windows.signCommand invokes the
      # Trusted Signing CLI; with these unset the signCommand is skipped by Tauri and
      # the build stays unsigned + green. Add repo secrets to turn on:
      #   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #   AZURE_TS_ENDPOINT, AZURE_TS_ACCOUNT, AZURE_TS_CERT_PROFILE.
      - name: Enable Windows signing (only if Azure creds present)
        if: matrix.platform == 'windows-latest' && env.HAS_AZURE_CLIENT != ''
        shell: pwsh
        run: |
          "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" >> $env:GITHUB_ENV
          "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" >> $env:GITHUB_ENV
          "AZURE_CLIENT_SECRET=${{ secrets.AZURE_CLIENT_SECRET }}" >> $env:GITHUB_ENV
          "AZURE_TS_ENDPOINT=${{ secrets.AZURE_TS_ENDPOINT }}" >> $env:GITHUB_ENV
          "AZURE_TS_ACCOUNT=${{ secrets.AZURE_TS_ACCOUNT }}" >> $env:GITHUB_ENV
          "AZURE_TS_CERT_PROFILE=${{ secrets.AZURE_TS_CERT_PROFILE }}" >> $env:GITHUB_ENV
          "LT_WINDOWS_SIGN=1" >> $env:GITHUB_ENV
          Write-Host "Windows Azure Trusted Signing ENABLED for this build."

      - name: Build + publish desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing (required for auto-update) — always present.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # OS code signing (macOS Apple vars / Windows Azure vars) is injected into
          # $GITHUB_ENV by the two conditional steps above — present only when the
          # corresponding secrets exist, so the build is signed+notarized when
          # configured and cleanly unsigned (green) otherwise.
        with:
          projectPath: .
          # @tauri-apps/cli isn't a project dep; npx fetches it on-demand in CI so
          # the pnpm lockfile stays untouched. App deps still install via pnpm above.
          tauriScript: npx @tauri-apps/cli
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: 'LiveTranscript ${{ github.ref_name }}'
          releaseBody: 'Auto-generated release. The desktop app updates itself on launch.'
          releaseDraft: false
          prerelease: false
          # tauri-action generates latest.json (the updater manifest) and uploads it
          # to the GitHub release. The separate publish-updates job below republishes
          # it (with rewritten URLs) to a public Blob store, since the app's updater
          # endpoint points at livetranscript.ai/updates (private-repo-safe).
          includeUpdaterJson: true

  # Mirror the release's updater artifacts to a PUBLIC Blob store and rewrite
  # latest.json so the app fetches everything via livetranscript.ai/updates
  # (survives the repo going private). Runs AFTER both build jobs so it can pull
  # the MERGED, both-platform latest.json from the GitHub release — a single build
  # job's local target/ only has that job's own platform, which would ship a
  # one-platform manifest and silently break updates for the other OS.
  publish-updates:
    needs: build
    runs-on: ubuntu-latest
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pull the merged manifest + updater bundles (+ .sig) from the release.
      - name: Download release assets
        if: ${{ env.BLOB_READ_WRITE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/rel
          gh release download "${{ github.ref_name }}" --dir /tmp/rel --clobber

      # Install the Blob SDK in an ISOLATED dir and run the script FROM there, so
      # ESM bare-specifier resolution finds @vercel/blob (NODE_PATH doesn't work for
      # ESM) and npm never touches the pnpm workspace (which broke `npm i` before).
      - name: Publish updates to public store (private-repo-safe)
        if: ${{ env.BLOB_READ_WRITE_TOKEN != '' }}
        env:
          UPDATES_PUBLIC_BASE: https://livetranscript.ai/updates
        run: |
          mkdir -p /tmp/pub
          cp scripts/publish-updates.mjs /tmp/pub/
          cd /tmp/pub
          npm init -y >/dev/null 2>&1
          npm i @vercel/blob >/dev/null 2>&1
          node publish-updates.mjs /tmp/rel
