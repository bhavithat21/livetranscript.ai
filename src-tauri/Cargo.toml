[package]
name = "livetranscript-desktop"
version = "0.1.0"
description = "LiveTranscript desktop app"
authors = ["LiveTranscript"]
edition = "2021"

# The library the app binary links against.
[lib]
name = "livetranscript_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# When `tauri dev`/`tauri build` runs, the custom-protocol feature is enabled
# for the production asset protocol; kept on by default.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
