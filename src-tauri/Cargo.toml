[package]
name = "livetranscript-desktop"
version = "0.1.0"
description = "LiveTranscript desktop app"
authors = ["LiveTranscript"]
edition = "2021"

# The library the app binary links against.
[lib]
name = "livetranscript_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: enables transparent windows on macOS (paired with
# macOSPrivateApi + transparent in tauri.conf.json). App Store forbids this API,
# but we distribute outside the App Store, so it's fine.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-shell = "2" # spawn the macOS ScreenCaptureKit sidecar
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows-only: WASAPI loopback capture via cpal. Never fetched/built on macOS.
[target.'cfg(target_os = "windows")'.dependencies]
cpal = "0.15"
crossbeam-channel = "0.5"

[features]
# When `tauri dev`/`tauri build` runs, the custom-protocol feature is enabled
# for the production asset protocol; kept on by default.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
